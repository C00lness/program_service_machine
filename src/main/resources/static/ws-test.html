<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>Мониторинг программ гибки (Real-time)</h2>
<div id="status">Connect...</div>
<ul id="messages"></ul>

<script>
    var socket = new SockJS('http://localhost:8082/ws');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        document.getElementById('status').innerText = 'Connect WebSocket!';

        stompClient.subscribe('/topic/programs', function (message) {
            var program = JSON.parse(message.body);
            var li = document.createElement('li');
            li.innerText = 'Program create: ' + program.name + ' (ID: ' + program.id + ')';
            document.getElementById('messages').appendChild(li);
        });
    });
</script>
</body>
</html>
